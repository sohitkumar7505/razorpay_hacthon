<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentic Merchant Catalogue</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <p class="eyebrow">RAZORPAY BUILDATHON · PHASE 1</p>
      <h1>A catalogue agents can trust.</h1>
      <p class="intro">Search authoritative merchant data. Prices, inventory and policies come from guarded APIs—not an AI guess.</p>
    </header>
    <main>
      <form id="search-form">
        <label>What are you looking for?<input id="query" name="q" placeholder="e.g. skincare gift" autocomplete="off"></label>
        <label>Maximum price (₹)<input id="max-price" name="maxPrice" type="number" min="0" placeholder="2000"></label>
        <label class="checkbox"><input id="in-stock" name="inStock" type="checkbox" checked> In stock only</label>
        <button type="submit">Search catalogue</button>
      </form>
      <div class="status"><span id="result-count">Loading catalogue…</span><span class="live">● API live</span></div>
      <section id="products" aria-live="polite"></section>
    </main>
    <footer>Every search and inventory check is recorded in the audit trail.</footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
