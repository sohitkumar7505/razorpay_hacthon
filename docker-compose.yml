services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev
    ports:
      - "5432:5432"
    volumes:
      - agentic_commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d agentic_commerce"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  agentic_commerce_data:
